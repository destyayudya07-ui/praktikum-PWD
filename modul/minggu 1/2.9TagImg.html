<html>
<head>
<title>Atribut dari Tag img</title>
</head>
<body>
<p><b>Tag img hanya dengan atribut src (rumah adat melayu)</b></p>
<img src="Rumah melayu.jpg">
<p><b>Tag img dengan border="3"(ibu kota negara)</b></p>
<img src="IKN.jpg" border="3">
<p><b>Tag img dengan height dan width(paris)</b></p>
<img src="paris.jpg" border="1" height="300" width="200">
</body>
</html>
